name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract MVP source archive from local ZIP records
        run: |
          python3 - <<'PY'
          import os, struct, zlib
          src = "GTKreativePayroll_MVP_v0.1.zip"
          out = "build-source"
          data = open(src, "rb").read()
          sig = bytes([0x50, 0x4b, 0x03, 0x04])
          pos = 0
          count = 0
          while True:
              pos = data.find(sig, pos)
              if pos < 0:
                  break
              if pos + 30 > len(data):
                  break
              _, ver, flag, method, mt, md, crc, csize, usize, nlen, elen = struct.unpack_from("<IHHHHHIIIHH", data, pos)
              name_b = data[pos+30:pos+30+nlen]
              extra_end = pos + 30 + nlen + elen
              if extra_end > len(data):
                  break
              name = name_b.decode("utf-8")
              payload_end = extra_end + csize
              if payload_end > len(data):
                  raise SystemExit(f"Truncated entry: {name}")
              target = os.path.join(out, name)
              if name.endswith("/"):
                  os.makedirs(target, exist_ok=True)
              else:
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  payload = data[extra_end:payload_end]
                  if method == 0:
                      raw = payload
                  elif method == 8:
                      try:
                          raw = zlib.decompress(payload, -15)
                      except zlib.error:
                          print(f"Skipping corrupt compressed entry: {name}")
                          pos = payload_end
                          continue
                  else:
                      raise SystemExit(f"Unsupported ZIP method {method}: {name}")
                  open(target, "wb").write(raw)
              count += 1
              pos = payload_end
          if count < 10:
              raise SystemExit(f"Archive extraction found only {count} entries")
          print(f"Extracted {count} entries from local ZIP records")
          PY

          cat .build/main0.kt .build/main1.kt .build/main2.kt .build/main3.kt .build/main4.kt .build/main5.kt > build-source/PayrollApp/app/src/main/java/com/gtkreative/payroll/MainActivity.kt
          wc -c build-source/PayrollApp/app/src/main/java/com/gtkreative/payroll/MainActivity.kt
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nkotlin.jvm.target.validation.mode=warning\n' >> build-source/PayrollApp/gradle.properties
          cp .build/AppDatabase.kt build-source/PayrollApp/app/src/main/java/com/gtkreative/payroll/data/AppDatabase.kt
          cp .build/Dao.kt build-source/PayrollApp/app/src/main/java/com/gtkreative/payroll/data/Dao.kt
          cp .build/Entities.kt build-source/PayrollApp/app/src/main/java/com/gtkreative/payroll/data/Entities.kt
          bash .build/gradle_fix.sh
          sed -i 's/, contentColor = Charcoal//g' build-source/PayrollApp/app/src/main/java/com/gtkreative/payroll/MainActivity.kt


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: build-source/PayrollApp
        env:
          GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"
          JAVA_TOOL_OPTIONS: "-Xmx2g -XX:MaxMetaspaceSize=1g"
        run: gradle --no-daemon --max-workers=2 :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTKreativePayroll-debug
          path: build-source/PayrollApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
