name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct MVP source archive
        run: |
          rm -rf build-source
          cat .build/zip.part1 .build/zip.part2 .build/zip.part3 .build/zip.part4 .build/zip.part5 | tr -d '\n\r' | base64 -d > GTKreativePayroll_MVP_v0.1.zip
          unzip -q GTKreativePayroll_MVP_v0.1.zip -d build-source

      - name: Build debug APK
        working-directory: build-source/PayrollApp
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTKreativePayroll-debug
          path: build-source/PayrollApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
