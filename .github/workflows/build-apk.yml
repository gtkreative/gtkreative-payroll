name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Decode and extract MVP source archive
        run: |
          base64 -di GTKreativePayroll_MVP_v0.1.zip > mvp.zip
          unzip -q mvp.zip -d build-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: build-source/PayrollApp
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTKreativePayroll-debug
          path: build-source/PayrollApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
