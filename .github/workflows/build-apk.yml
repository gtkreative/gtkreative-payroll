name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract MVP source archive from local ZIP records
        run: |
          python3 - <<'PY'
          import os, struct, zlib
          src = "GTKreativePayroll_MVP_v0.1.zip"
          out = "build-source"
          data = open(src, "rb").read()
          pos = 0
          count = 0
          while True:
              pos = data.find(b"PK\\x03\\x04", pos)
              if pos < 0:
                  break
              if pos + 30 > len(data):
                  break
              sig, ver, flag, method, mt, md, crc, csize, usize, nlen, elen = struct.unpack_from("<IHHHHHIIIHH", data, pos)
              name_b = data[pos+30:pos+30+nlen]
              extra_end = pos + 30 + nlen + elen
              if extra_end > len(data):
                  break
              name = name_b.decode("utf-8")
              payload_end = extra_end + csize
              if payload_end > len(data):
                  raise SystemExit(f"Truncated entry: {name}")
              target = os.path.join(out, name)
              if name.endswith("/"):
                  os.makedirs(target, exist_ok=True)
              else:
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  payload = data[extra_end:payload_end]
                  if method == 0:
                      raw = payload
                  elif method == 8:
                      raw = zlib.decompress(payload, -15)
                  else:
                      raise SystemExit(f"Unsupported ZIP method {method}: {name}")
                  open(target, "wb").write(raw)
              count += 1
              pos = payload_end
          if count < 10:
              raise SystemExit(f"Archive extraction found only {count} entries")
          print(f"Extracted {count} entries from local ZIP records") 
          PY

      - name: Decode and extract MVP source archive
        run: |
          base64 -d GTKreativePayroll_MVP_v0.1.zip > mvp.zip
          unzip -q mvp.zip -d build-source\n\n      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: build-source/PayrollApp
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTKreativePayroll-debug
          path: build-source/PayrollApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
